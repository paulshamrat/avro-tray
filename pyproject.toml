[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avro-tray"
version = "1.0.0"
description = "A lightweight system tray indicator and fast switcher for Avro Keyboard on Linux (GNOME/Wayland/X11)"
readme = "README.md"
authors = [
    { name = "Shamrat Paul", email = "shamrap@clemson.edu" }
]
urls = { "Homepage" = "https://github.com/paulshamrat/avro-tray", "Repository" = "https://github.com/paulshamrat/avro-tray" }
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Gnome",
    "Topic :: Desktop Environment :: Gnome"
]
dependencies = [
    "PyQt5>=5.15.0"
]

[project.scripts]
avro-tray = "avro_tray.main:main"

[tool.setuptools.packages.find]
where = ["src"]
